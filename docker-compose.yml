# Local parity for the container image — the same Dockerfile the PaaS targets
# build, with Postgres instead of the demo SQLite file so the driver the
# production deployment uses is the one exercised here.
#
#   cp .env.example .env
#   docker compose run --rm app php artisan key:generate --show   # paste into .env
#   docker compose up --build
#
# then http://localhost:8080/login
#
# `docker compose up` migrates on start (one app instance, so RUN_MIGRATIONS is
# safe). It does NOT seed: the demo tenants are for `php artisan migrate --seed`
# on a laptop, not for anything that looks like production.

services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: paykaro
      DB_USERNAME: paykaro
      DB_PASSWORD: paykaro

      # One instance: migrate here. Anything with replicas migrates in CI.
      RUN_MIGRATIONS: "true"
      BUILD_CACHES: "false"

      # The drivers the image defaults to in production, so what runs here is
      # what runs there (both tables ship in the base migrations).
      SESSION_DRIVER: database
      CACHE_STORE: database

      # No TLS in front of :8080 locally; leave proxy trust off.
      TRUSTED_PROXIES: ""

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paykaro
      POSTGRES_USER: paykaro
      POSTGRES_PASSWORD: paykaro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paykaro -d paykaro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
