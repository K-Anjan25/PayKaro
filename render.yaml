# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render's native runtimes are node, python, ruby, go, elixir and rust — there is
# no PHP one — so this service builds the Dockerfile in this repo: FrankenPHP
# (Caddy + PHP 8.3) serving `public/` on `$PORT`.
#
# New → Blueprint → pick this repo → Apply. Render asks for the three variables
# marked `sync: false` (APP_KEY, APP_URL, DB_URL) and nothing else.

services:
  - type: web
    name: paykaro
    runtime: docker
    # Oregon, Ohio, Virginia, Frankfurt or Singapore. Singapore is the closest to
    # India, and a service's region cannot be changed after it is created.
    region: singapore
    # `free` (0.1 CPU / 512 MB) spins down after ~15 minutes without traffic and
    # the first request after that is a cold boot. `0.5c-512mb` keeps it warm.
    plan: free
    # Laravel's own health route (bootstrap/app.php → withRouting(health: '/up')).
    # Render will not route traffic to an instance until this answers 200.
    healthCheckPath: /up
    # off | commit | checksPass — `commit` is the default for a new service.
    autoDeployTrigger: commit

    envVars:
      # --- framework -------------------------------------------------------
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Paste the output of `php artisan key:generate --show`, prefix included:
      # Laravel wants `base64:<44 chars>`, so a generated value will not do.
      - key: APP_KEY
        sync: false
      # The URL this service is served from, e.g. https://paykaro.onrender.com.
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Render terminates TLS and hands the app plain HTTP. Without trusting that
      # proxy Laravel generates http:// URLs and drops the secure session cookie.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      # Both tables ship in the base migrations; `file` would not survive a deploy
      # (the filesystem is ephemeral) or be shared between instances.
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync

      # --- database --------------------------------------------------------
      # Any Laravel driver. Paste the connection string here; Render's own
      # Postgres calls it DATABASE_URL, other providers do the same, so copy that
      # value into DB_URL.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false

      # --- container start-up (docker/entrypoint.sh) -----------------------
      # Migrate on boot. Correct while there is ONE instance; with more than one,
      # turn this off and use a pre-deploy command instead (paid plans only).
      - key: RUN_MIGRATIONS
        value: "true"
      - key: BUILD_CACHES
        value: "true"

      # --- PayKaro business rules (config/paykaro.php) ---------------------
      # These are the numbers a claim rests on. They are configuration, not code.
      - key: PAYKARO_MSME_DUE_DAYS
        value: "45"
      - key: PAYKARO_DEFAULT_TAX_RATE
        value: "18"
      - key: PAYKARO_BANK_RATE
        value: "5.5"
      - key: PAYKARO_INTEREST_MULTIPLIER
        value: "3"
      - key: PAYKARO_FINANCE_READY_SCORE
        value: "85"
      - key: PAYKARO_ALERT_LIMIT
        value: "6"
      # Off in production: `true` labels the workspace "Demo" and prints the
      # seeded logins on the sign-in page.
      - key: PAYKARO_DEMO
        value: "false"

      # --- Google Sign-In (optional) --------------------------------------
      # Unset means the "Continue with Google" button is not rendered and
      # /auth/google* answers 404. Add these in the dashboard to turn it on.
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # - key: GOOGLE_REDIRECT_URI
      #   sync: false

# To use Render's own Postgres instead of an external one, uncomment this and
# replace the DB_URL variable above with the `fromDatabase` form shown. Note
# that a free Render database is deleted 30 days after it is created, so a real
# book of business belongs on a paid instance or an external provider.
#
# databases:
#   - name: paykaro-db
#     plan: free
#
# and, in the service's envVars:
#   - key: DB_URL
#     fromDatabase:
#       name: paykaro-db
#       property: connectionString
