name: CI

# Two jobs, deliberately split: `lint` needs nothing but a PHP binary, so it stays
# green (and useful) even when dependency installation is the thing that broke.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint every PHP file
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' -not -path './bridge/node_modules/*' -print0 \
            | xargs -0 -n1 php -l

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # The suite needs sqlite3 (phpunit.xml pins :memory:), and the demo
          # seeder writes to database/paykaro.sqlite.
          extensions: sqlite3, mbstring, xml, curl, zip, intl
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}-php83

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # bootstrap/app.php returns a 403 view when a tenant cannot be resolved, and
      # the demo seeder is what makes the two seeded logins exist; both are asserted
      # below rather than assumed.
      - name: Prepare the app
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --ansi
          php artisan migrate --force

      - name: Static analysis (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Run the test suite
        run: php artisan test